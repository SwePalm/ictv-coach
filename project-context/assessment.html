<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ICTV Coaching Assessment</title>
  <!-- Self-contained on purpose: no external scripts, styles or fonts, so the page opens anywhere. -->
  <style>
/* ictv-shared:css:start */
/* Shared look for every ICTV Coach page. Edit here, then run: node tools/check.mjs --fix
   Colours fall back to the host app's theme variables when the page is shown inside one. */
:root {
  color-scheme: light dark;
  --ictv-bg: var(--background, #f5f6f8);
  --ictv-surface: var(--card, #ffffff);
  --ictv-sunken: var(--secondary, #eef1f5);
  --ictv-line: var(--border, #d9dee7);
  --ictv-text: var(--foreground, #131a26);
  --ictv-muted: var(--muted-foreground, #545f71);
  --ictv-accent: var(--primary, #0a66c2);
  --ictv-on-accent: var(--primary-foreground, #ffffff);
  --ictv-warn: #b45309;
}
@media (prefers-color-scheme: dark) {
  :root {
    --ictv-bg: var(--background, #0c1118);
    --ictv-surface: var(--card, #151c27);
    --ictv-sunken: var(--secondary, #1c2533);
    --ictv-line: var(--border, #2b3647);
    --ictv-text: var(--foreground, #eef2f7);
    --ictv-muted: var(--muted-foreground, #9aa6b8);
    --ictv-accent: var(--primary, #5cb3ff);
    --ictv-on-accent: var(--primary-foreground, #08111c);
    --ictv-warn: #f5b041;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 24px 16px 48px;
  background: var(--ictv-bg);
  color: var(--ictv-text);
  font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  -webkit-font-smoothing: antialiased;
}
#app { max-width: 880px; margin: 0 auto; display: grid; gap: 20px; }
h1, h2, h3, p, ul { margin: 0; }
h1 { font-size: 22px; line-height: 1.25; }
h2 { font-size: 16px; }
h3 { font-size: 14px; }
ul { padding-left: 18px; }
code, pre, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--ictv-accent); outline-offset: 2px; }

.card { background: var(--ictv-surface); border: 1px solid var(--ictv-line); border-radius: 14px; padding: 22px; display: grid; gap: 14px; }
.panel { background: var(--ictv-sunken); border: 1px solid var(--ictv-line); border-radius: 10px; padding: 14px; display: grid; gap: 8px; align-content: start; }
.panel.plain { background: var(--ictv-surface); }
.panel.key { border: 2px solid var(--ictv-accent); }
.row { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; }
.row.start { justify-content: flex-start; }
.row.end { align-items: flex-end; }
.stack { display: grid; gap: 10px; align-content: start; }
.grow { flex: 1 1 220px; min-width: 0; }
.grid { display: grid; gap: 12px; }
@media (min-width: 720px) {
  .grid.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .grid.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .grid.four { grid-template-columns: repeat(4, minmax(0, 1fr)); }
}
@media (max-width: 719px) { .grid.four { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

.eyebrow { font-size: 11.5px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--ictv-accent); }
.eyebrow.quiet { color: var(--ictv-muted); }
.muted { color: var(--ictv-muted); }
.small { font-size: 13px; }
.strong { font-weight: 600; }
.warn { color: var(--ictv-warn); }
.struck { text-decoration: line-through; color: var(--ictv-muted); }
.pre { white-space: pre-line; }

.tag { display: inline-block; font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 999px; border: 1px solid var(--ictv-line); background: var(--ictv-surface); white-space: nowrap; }
.tag.on { background: var(--ictv-accent); border-color: var(--ictv-accent); color: var(--ictv-on-accent); }

.btn { border: 1px solid var(--ictv-line); background: var(--ictv-sunken); border-radius: 9px; padding: 8px 14px; font-size: 13px; font-weight: 600; }
.btn:hover { border-color: var(--ictv-accent); }
.btn.primary { background: var(--ictv-accent); border-color: var(--ictv-accent); color: var(--ictv-on-accent); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.link { border: 0; background: none; padding: 0; color: var(--ictv-accent); text-decoration: underline; font-weight: 500; }
.btn.small { padding: 5px 10px; }

.choice { display: grid; gap: 6px; align-content: start; width: 100%; text-align: left; background: var(--ictv-bg); border: 1px solid var(--ictv-line); border-radius: 12px; padding: 14px; }
.choice:hover { border-color: var(--ictv-accent); }
.choice[aria-pressed="true"] { background: var(--ictv-sunken); border-color: var(--ictv-accent); box-shadow: inset 0 0 0 1px var(--ictv-accent); }
.choice.slim { padding: 8px 12px; border-radius: 9px; font-size: 13px; font-weight: 500; }
.choice.slim[aria-pressed="true"] { background: var(--ictv-accent); color: var(--ictv-on-accent); }

.field { display: grid; gap: 4px; font-size: 12.5px; color: var(--ictv-muted); }
.field input, .field select, .field textarea { width: 100%; background: var(--ictv-bg); color: var(--ictv-text); border: 1px solid var(--ictv-line); border-radius: 9px; padding: 8px 10px; font-size: 14px; }
.field textarea { resize: vertical; min-height: 64px; line-height: 1.4; }
.sample { background: var(--ictv-surface); border: 1px solid var(--ictv-line); border-radius: 8px; padding: 10px; white-space: pre-line; }
.filepreview { margin: 0; background: var(--ictv-bg); border: 1px solid var(--ictv-line); border-radius: 10px; padding: 14px; white-space: pre-wrap; overflow-wrap: anywhere; max-height: 460px; overflow: auto; }
.checks { list-style: none; padding: 0; display: grid; gap: 6px; font-size: 13.5px; }
.checks li { display: grid; grid-template-columns: 20px 1fr; gap: 6px; }
@media print { .btn, .noprint { display: none; } body { background: #fff; } }
/* ictv-shared:css:end */
  </style>
</head>
<body>
  <!-- Data payload. The coach fills this JSON with the person's real audit findings. Optional key: nextCheckin.
       Write plain text only (the page escapes it), keep it valid JSON, and never include a closing script tag. -->
  <script id="ictv-assessment-data" type="application/json">
  {
    "userName": "Practitioner",
    "date": "2026-10-16",
    "roleSummary": "Knowledge worker delegating research, synthesis, and repeatable deliverables to AI.",
    "primaryBlockerLetter": "V",
    "primaryBlockerHeadline": "Verification happens after the draft is written—making your own reading speed the bottleneck.",
    "strengths": [
      "Clear intent on what business outcome matters before starting a conversation.",
      "Separates durable project files from scratch chat conversations."
    ],
    "pillars": {
      "V": {
        "name": "Verification",
        "tag": "Primary Blocker",
        "question": "How do we know it was done well before reading every word?",
        "observedSignal": "Outputs are reviewed top-to-bottom after generation, without a pre-draft Check Report or explicit 'Not checked' line.",
        "intervention": "Require a 4-point Check Report + mandatory 'Not checked:' line at the top of every deliverable before reading the prose."
      },
      "I": {
        "name": "Instructions",
        "tag": "Loop Connected",
        "question": "How is the work specified, including what is NOT acceptable?",
        "observedSignal": "Goals are clear, but negative boundaries ('Not acceptable') are often added only after a first draft misses.",
        "intervention": "Add 3 explicit 'Not acceptable' bullets to repeating task briefs."
      },
      "C": {
        "name": "Context",
        "tag": "Working Well",
        "question": "What does the job need to know and how should results arrive?",
        "observedSignal": "Project context lives in plain Markdown files inside an owned folder.",
        "intervention": "Apply the 3x Paste Rule whenever background is repeated across threads."
      },
      "T": {
        "name": "Tools",
        "tag": "Scoped",
        "question": "What is read-only context plumbing vs. staged action?",
        "observedSignal": "Read-only tools are connected; external writes remain staged for human sign-off.",
        "intervention": "Turn repeatable validation checks into a small deterministic script."
      }
    },
    "experimentOptions": [
      {
        "id": "exp-v1",
        "letter": "V",
        "recommended": true,
        "title": "Check Report Before Draft (with 'Not Checked' line)",
        "task": "Next deliverable or client/team summary this week",
        "whyItWorks": "Forces verification criteria upfront and points your eyes straight to unverified assumptions instead of reading every sentence.",
        "successMetric": "Catch any missing context or assumption from the Check Report in under 60 seconds."
      },
      {
        "id": "exp-i1",
        "letter": "I",
        "recommended": false,
        "title": "Run a 5-Minute Handover Interview on 1 Repeating Task",
        "task": "A task you do at least once a week",
        "whyItWorks": "Moves you from re-prompting in chat to a reusable handover.md with hard negative constraints.",
        "successMetric": "Save 1 reusable handover file in ictv-coach/handovers/ and run it twice."
      },
      {
        "id": "exp-c1",
        "letter": "C",
        "recommended": false,
        "title": "The 3x Paste Rule Audit",
        "task": "Extract recurring role, audience, and tone rules into profile.md",
        "whyItWorks": "Eliminates re-explaining who you are and who you write for at the start of every session.",
        "successMetric": "Zero manual background copy-pasting across 5 consecutive AI sessions."
      }
    ]
  }
  </script>

  <main id="app"></main>

  <script>
/* ictv-shared:js:start */
// Shared helpers for every ICTV Coach page. Edit here, then run: node tools/check.mjs --fix
const ICTV = (() => {
  const ESCAPES = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };

  // Everything from the data payload or typed by the person goes through esc() before it becomes HTML.
  const esc = value => String(value ?? '').replace(/[&<>"']/g, ch => ESCAPES[ch]);

  // Keeps a value on one line so it cannot break the structure of a saved Markdown file.
  const oneLine = value => String(value ?? '').replace(/\s*\n\s*/g, ' ').trim();

  const readPayload = id => JSON.parse(document.getElementById(id).textContent);

  // Returns 'saved' (written where the person chose), 'downloaded' (sent to the Downloads folder),
  // 'cancelled' (the person closed the dialog) or 'blocked' (this viewer allows neither).
  async function saveTextFile(filename, text) {
    if (typeof window.showSaveFilePicker === 'function') {
      try {
        const handle = await window.showSaveFilePicker({
          suggestedName: filename,
          types: [{ description: 'Markdown file', accept: { 'text/markdown': ['.md'] } }]
        });
        const writable = await handle.createWritable();
        await writable.write(text);
        await writable.close();
        return 'saved';
      } catch (err) {
        if (err && err.name === 'AbortError') return 'cancelled';
        // Embedded viewers refuse the dialog. Fall through to a plain download.
      }
    }
    try {
      const url = URL.createObjectURL(new Blob([text], { type: 'text/markdown;charset=utf-8' }));
      const link = document.createElement('a');
      link.href = url;
      link.download = filename;
      document.body.appendChild(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      return 'downloaded';
    } catch (err) {
      return 'blocked';
    }
  }

  function saveMessage(result, filename, folder) {
    const name = `<strong>${esc(filename)}</strong>`;
    const where = `<code>${esc(folder)}</code>`;
    if (result === 'saved') return `Saved ${name}. Keep it in ${where} so your assistant reads it next time.`;
    if (result === 'downloaded') return `${name} was sent to your downloads. Move it to ${where}. If no file appeared, the full text is below: select it and save it under that name.`;
    if (result === 'blocked') return `This viewer does not allow saving files. The full text of ${name} is below: select it and save it in ${where}.`;
    return '';
  }

  // Draws view() into root and redraws after every action. Buttons carry data-action (and an optional
  // data-arg); fields carry data-input. Typing updates state without a full redraw, so the cursor never
  // jumps; only regions marked data-live="name" are refreshed, from live[name](). data-key lets keyboard
  // focus survive a redraw.
  function mount(root, view, actions, live = {}) {
    function render() {
      const active = document.activeElement;
      const key = active && active.getAttribute ? active.getAttribute('data-key') : null;
      root.innerHTML = view();
      if (!key) return;
      for (const el of root.querySelectorAll('[data-key]')) {
        if (el.getAttribute('data-key') === key) { el.focus(); break; }
      }
    }
    root.addEventListener('click', event => {
      const el = event.target.closest ? event.target.closest('[data-action]') : null;
      if (!el || !root.contains(el)) return;
      const action = actions[el.getAttribute('data-action')];
      if (action) Promise.resolve(action(el.getAttribute('data-arg'))).then(render);
    });
    root.addEventListener('input', event => {
      const el = event.target;
      const name = el && el.getAttribute ? el.getAttribute('data-input') : null;
      if (!name || !actions[name]) return;
      actions[name](el.value);
      for (const region of root.querySelectorAll('[data-live]')) {
        const draw = live[region.getAttribute('data-live')];
        if (draw) region.innerHTML = draw();
      }
    });
    root.addEventListener('keydown', event => {
      const el = event.target;
      const name = event.key === 'Enter' && el && el.getAttribute ? el.getAttribute('data-enter') : null;
      if (name && actions[name]) { event.preventDefault(); Promise.resolve(actions[name]()).then(render); }
    });
    render();
    return render;
  }

  const LETTERS = {
    V: { name: 'Verification', hint: 'A flaw got through because no written-down check would have caught it.' },
    I: { name: 'Instructions', hint: 'The goal or a "not acceptable" boundary was unstated or vague.' },
    C: { name: 'Context', hint: 'The assistant had to guess background, audience or examples that live in your head.' },
    T: { name: 'Tools', hint: 'The assistant guessed something it should have looked up or calculated, or it had the wrong access.' }
  };

  return { esc, oneLine, readPayload, saveTextFile, saveMessage, mount, LETTERS };
})();
/* ictv-shared:js:end */

    const data = ICTV.readPayload('ictv-assessment-data');
    const { esc, oneLine } = ICTV;
    const recommended = data.experimentOptions.find(e => e.recommended) || data.experimentOptions[0];
    const state = {
      pillar: data.primaryBlockerLetter || 'V',
      experimentId: recommended.id,
      task: recommended.task || '',
      checkin: data.nextCheckin || '',
      preview: false,
      saveResult: ''
    };
    const FILENAME = 'active-focus.md';
    const experiment = () => data.experimentOptions.find(e => e.id === state.experimentId) || data.experimentOptions[0];

    function buildActiveFocusMarkdown() {
      const exp = experiment();
      return `# Active Coaching Focus

*Updated: ${oneLine(data.date)}*

## Current Blocker
- **How It Shows Up in My Work:** ${oneLine(data.primaryBlockerHeadline)}
- **Primary ICTV Pillar Involved:** \`[${oneLine(data.primaryBlockerLetter)}]\`

## This Week's Practice Experiment
- **The One Thing I'm Trying:** ${oneLine(exp.title)} \`[${oneLine(exp.letter)}]\`
- **Real Task to Test It On:** ${oneLine(state.task) || oneLine(exp.task)}
- **How We Know It Worked:** ${oneLine(exp.successMetric)}

## Next Check-in
- **Scheduled For:** ${oneLine(state.checkin) || '[Day / Time]'}
`;
    }

    const actions = {
      selectPillar(letter) { state.pillar = letter; },
      selectExperiment(id) {
        state.experimentId = id;
        state.task = experiment().task || '';
      },
      setTask(value) { state.task = value; },
      setCheckin(value) { state.checkin = value; },
      togglePreview() { state.preview = !state.preview; },
      async save() {
        const result = await ICTV.saveTextFile(FILENAME, buildActiveFocusMarkdown());
        if (result === 'cancelled') return;
        state.saveResult = result;
        if (result !== 'saved') state.preview = true;
      }
    };

    const previewView = () => esc(buildActiveFocusMarkdown());

    function view() {
      const pillar = data.pillars[state.pillar];
      return `
        <header class="card">
          <div class="row">
            <div class="stack" style="gap: 4px">
              <span class="eyebrow">ICTV Coach · Assessment from your own work</span>
              <h1>${esc(data.userName)}: working diagnosis</h1>
              <p class="muted">${esc(data.roleSummary)}</p>
            </div>
            <span class="tag">Assessed ${esc(data.date)}</span>
          </div>
          <div class="grid two">
            <div class="panel">
              <span class="eyebrow quiet">What already works well</span>
              <ul class="stack" style="gap: 6px">${data.strengths.map(s => `<li>${esc(s)}</li>`).join('')}</ul>
            </div>
            <div class="panel key">
              <div class="row"><span class="eyebrow">Your main blocker · ${esc(data.primaryBlockerLetter)}</span><span class="tag on">Start here</span></div>
              <p class="strong">${esc(data.primaryBlockerHeadline)}</p>
              <p class="muted small">Verification is not the last step of a pipeline. Writing down what good looks like shows what Instructions, Context or Tools need next.</p>
            </div>
          </div>
        </header>

        <section class="card">
          <div class="row">
            <div>
              <h2>The ICTV loop in your work</h2>
              <p class="muted small">Pick a letter to see what the audit found and the practice that goes with it.</p>
            </div>
            <span class="muted small">V pulls I, C and T up ↻</span>
          </div>
          <div class="grid four">
            ${['V', 'I', 'C', 'T'].map(letter => {
              const p = data.pillars[letter];
              return `
                <button class="choice" aria-pressed="${state.pillar === letter}" data-action="selectPillar" data-arg="${letter}" data-key="pillar-${letter}">
                  <span class="row"><span style="font-size: 20px; font-weight: 700">${letter}</span><span class="tag ${data.primaryBlockerLetter === letter ? 'on' : ''}">${esc(p.tag)}</span></span>
                  <span class="strong small">${esc(p.name)}</span>
                </button>`;
            }).join('')}
          </div>
          <div class="panel">
            <p><span class="strong">${esc(state.pillar)} · ${esc(pillar.name)}.</span> <span class="muted">${esc(pillar.question)}</span></p>
            <div class="grid two">
              <div class="panel plain"><span class="eyebrow quiet">Seen in your work</span><p class="small">${esc(pillar.observedSignal)}</p></div>
              <div class="panel plain"><span class="eyebrow">Practice</span><p class="small">${esc(pillar.intervention)}</p></div>
            </div>
          </div>
        </section>

        <section class="card">
          <div>
            <h2>Commit to one practice this week</h2>
            <p class="muted small">Start with less than you think you need. Pick one and test it on a real task.</p>
          </div>
          <div class="stack">
            ${data.experimentOptions.map(exp => `
              <button class="choice" aria-pressed="${exp.id === state.experimentId}" data-action="selectExperiment" data-arg="${esc(exp.id)}" data-key="exp-${esc(exp.id)}">
                <span class="row">
                  <span class="row start"><span class="tag">${esc(exp.letter)}</span><span class="strong">${esc(exp.title)}</span></span>
                  ${exp.recommended ? '<span class="tag on">Recommended</span>' : ''}
                </span>
                <span class="muted small">${esc(exp.whyItWorks)}</span>
                <span class="small"><span class="strong">How we know it worked:</span> ${esc(exp.successMetric)}</span>
              </button>`).join('')}
          </div>
          <div class="row end">
            <label class="field grow">Real task on my desk to test this on
              <input data-key="task" data-input="setTask" value="${esc(state.task)}" />
            </label>
            <label class="field" style="flex: 0 1 200px">Next check-in
              <input data-key="checkin" data-input="setCheckin" value="${esc(state.checkin)}" placeholder="e.g. Friday 15:00" />
            </label>
            <button class="btn" data-action="togglePreview" data-key="preview">${state.preview ? 'Hide file preview' : 'Preview file'}</button>
            <button class="btn primary" data-action="save" data-key="save">Save ${FILENAME}</button>
          </div>
          ${state.saveResult ? `<div class="panel key small" role="status"><span>${ICTV.saveMessage(state.saveResult, FILENAME, 'ictv-coach/')}</span></div>` : ''}
          ${state.preview ? `<pre class="filepreview" data-live="preview">${previewView()}</pre>` : ''}
        </section>`;
    }

    const page = { data, state, actions, view, buildActiveFocusMarkdown };
    window.ICTV_PAGE = page;
    ICTV.mount(document.getElementById('app'), view, actions, { preview: previewView });
  </script>
</body>
</html>
